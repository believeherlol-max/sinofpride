<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIN OF PRIDE - Official Store</title>
    <!-- Favicon (Store Logo) -->
    <link rel="icon" type="image/png" href="https://media.discordapp.net/attachments/1550353769395388508/1551158064869154919/content.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter, Great Vibes, and Cinzel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Great+Vibes&family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        cursive: ['Great Vibes', 'cursive'],
                        serif: ['Cinzel', 'serif'],
                    },
                    letterSpacing: {
                        widest: '.2em',
                        mega: '.3em',
                        ultra: '.4em',
                        luxury: '.5em',
                    }
                }
            }
        }
    </script>
    <style>
        html {
            scroll-behavior: smooth;
            overflow-y: scroll;
            scrollbar-width: none;
        }
        body {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overflow-x: hidden;
            scrollbar-width: none;
        }
        body::-webkit-scrollbar, html::-webkit-scrollbar {
            display: none;
        }
        input, textarea {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }
        .brand-title {
            font-family: 'Great Vibes', cursive;
            font-weight: 400;
            letter-spacing: 0.05em;
            font-size: 1.8rem;
        }
        #site-header {
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #site-header.header-hidden {
            transform: translateY(-100%);
        }
        @keyframes swipeUpSite {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-swipe-up {
            animation: swipeUpSite 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUpFade 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="flex flex-col min-h-full animate-swipe-up bg-[#0a0a0a] text-white transition-colors duration-300">

    <!-- Header -->
    <header id="site-header" class="sticky top-0 z-50 border-b border-neutral-900 bg-[#0a0a0a] text-white transition-colors duration-300">
        <div class="max-w-[1920px] mx-auto px-6 h-16 flex items-center justify-between relative">
            <nav class="hidden lg:flex items-center space-x-7 text-xs tracking-widest font-light">
                <a href="#" onclick="showShop()" class="hover:text-neutral-400 transition-colors duration-200">NEW</a>
                <a href="#" onclick="showShop()" class="hover:text-neutral-400 transition-colors duration-200">SHOP</a>
            </nav>

            <button id="mobile-menu-btn" class="lg:hidden text-lg p-2 focus:outline-none" aria-label="Toggle Menu">
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="absolute left-1/2 transform -translate-x-1/2 text-center">
                <a href="#" onclick="showShop()" class="brand-title hover:opacity-75 transition-opacity duration-200 whitespace-nowrap">
                    Sin of Pride
                </a>
            </div>

            <div class="flex items-center space-x-5 text-xs">
                <button onclick="toggleTheme()" class="hover:opacity-75 transition-opacity duration-200 p-1" aria-label="Toggle Theme" id="theme-toggle-btn">
                    <i class="fa-solid fa-moon text-sm"></i>
                </button>
                <a href="#login" onclick="openModal('login')" class="hidden sm:inline-block text-xs tracking-widest font-light hover:opacity-75">LOGIN</a>
                <a href="#wishlist" class="hover:opacity-75 relative group" aria-label="Wishlist" onclick="openWishlist()">
                    <i class="fa-regular fa-heart text-base font-light transition-transform duration-200 group-hover:scale-110"></i>
                    <span id="wishlist-count" class="absolute -top-1 -right-2 bg-white text-black text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
                </a>
                <button onclick="toggleCart()" class="hover:opacity-75 relative group flex items-center justify-center w-6 h-6" aria-label="Shopping Bag">
                    <img id="cart-icon-img" src="https://cdn.discordapp.com/emojis/810828604417507340.gif" alt="Bag" class="w-5 h-5 object-contain transition-transform duration-200 group-hover:scale-110">
                    <span id="cart-count" class="absolute -top-1 -right-2 bg-white text-black text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold shadow-sm">0</span>
                </button>
            </div>
        </div>

        <div class="border-t border-neutral-900 bg-[#0a0a0a] px-6 py-2.5 transition-colors duration-300" id="search-bar-container">
            <div class="max-w-[1920px] mx-auto flex items-center space-x-3 text-xs text-neutral-400">
                <i class="fa-solid fa-magnifying-glass text-neutral-500 text-sm"></i>
                <input type="text" id="site-search-input" placeholder="SEARCH PRODUCTS..." onkeypress="handleSearchInput(event)" class="w-full bg-transparent uppercase tracking-widest placeholder-neutral-500 focus:outline-none font-light text-xs">
            </div>
        </div>
    </header>

    <!-- Mobile Menu Drawer -->
    <div id="mobile-menu" class="fixed inset-0 z-50 bg-[#0a0a0a] text-white transform translate-x-full transition-transform duration-300 ease-in-out lg:hidden flex flex-col">
        <div class="flex items-center justify-between p-6 border-b border-neutral-900">
            <span class="brand-title text-xl">Sin of Pride</span>
            <button id="mobile-menu-close" class="text-lg p-2"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="flex flex-col space-y-6 p-8 text-sm font-light tracking-widest">
            <a href="#" onclick="closeMobileMenu(); showShop();" class="hover:text-neutral-400">NEW</a>
            <a href="#" onclick="closeMobileMenu(); showShop();" class="hover:text-neutral-400">SHOP</a>
            <hr class="border-neutral-900 my-3">
            <a href="#login" onclick="closeMobileMenu(); openModal('login');" class="text-xs">LOGIN</a>
        </div>
    </div>

    <!-- Main Content -->
    <main id="main-content" class="flex-1 flex flex-col">
        
        <!-- Shop View -->
        <div id="page-shop" class="flex-1 flex flex-col py-16 px-6 max-w-[1400px] mx-auto w-full animate-slide-up">
            <div class="mb-8 flex items-center justify-between border-b border-neutral-800 pb-4">
                <button onclick="showNotification('You are already on the Fall Collection catalogue')" class="text-xs tracking-widest text-neutral-400 hover:opacity-75 flex items-center space-x-2">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </button>
                <span class="text-[11px] tracking-mega text-neutral-500 uppercase font-light">CATALOGUE</span>
            </div>

            <div class="text-center mb-8">
                <h2 class="text-2xl sm:text-3xl font-serif font-light tracking-widest uppercase">FALL COLLECTION</h2>
                <div id="category-filters" class="flex flex-wrap justify-center gap-2 sm:gap-3 mt-6 text-xs uppercase tracking-widest">
                    <button onclick="filterCategory('ALL')" data-category="ALL" class="cat-btn px-6 py-2.5 border border-neutral-800 transition-all duration-200 font-medium">ALL</button>
                    <button onclick="filterCategory('TOPS')" data-category="TOPS" class="cat-btn px-6 py-2.5 border border-neutral-800 transition-all duration-200">TOPS</button>
                    <button onclick="filterCategory('BOTTOMS')" data-category="BOTTOMS" class="cat-btn px-6 py-2.5 border border-neutral-800 transition-all duration-200">BOTTOMS</button>
                    <button onclick="filterCategory('MORE')" data-category="MORE" class="cat-btn px-6 py-2.5 border border-neutral-800 transition-all duration-200">MORE</button>
                </div>
            </div>

            <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </div>

        <!-- Product Details View -->
        <div id="page-product-detail" class="flex-1 flex flex-col hidden py-12 px-6 max-w-[1200px] mx-auto w-full animate-slide-up">
            <div class="mb-8">
                <button onclick="showShop()" class="text-xs tracking-widest text-neutral-400 hover:opacity-75 flex items-center space-x-2">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </button>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-start">
                <div class="space-y-4">
                    <div id="detail-img-wrapper" class="w-full h-[500px] bg-neutral-900/50 border border-neutral-800 flex items-center justify-center p-4">
                        <img id="detail-active-img" src="" class="w-full h-full object-contain pointer-events-none transition-all duration-500">
                    </div>
                    <div id="detail-thumbnails" class="flex space-x-3 justify-center"></div>
                </div>
                <div class="flex flex-col space-y-6 pt-4">
                    <div>
                        <h1 id="detail-title" class="text-xl sm:text-2xl font-bold uppercase tracking-widest font-serif"></h1>
                        <p id="detail-price" class="text-sm font-semibold tracking-wider mt-2"></p>
                    </div>
                    <p class="text-xs text-neutral-400 uppercase tracking-widest font-light">Material: <span id="detail-material">Cotton</span></p>
                    <div class="pt-6 border-t border-neutral-800">
                        <button id="detail-add-btn" onclick="addCurrentProductToCart()" class="w-full bg-white text-black text-xs uppercase tracking-widest py-4 transition-all active:scale-95 hover:opacity-90">
                            ADD TO BAG
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Checkout Form Page View -->
        <div id="page-checkout" class="flex-1 flex flex-col hidden py-12 px-6 max-w-[800px] mx-auto w-full animate-slide-up">
            <div class="mb-8">
                <button onclick="toggleCart()" class="text-xs tracking-widest text-neutral-400 hover:opacity-75 flex items-center space-x-2">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                    <span>RETURN TO BAG</span>
                </button>
            </div>
            <h2 class="text-xl sm:text-2xl font-serif font-light tracking-widest uppercase mb-8 text-center">SECURE CHECKOUT</h2>
            
            <form onsubmit="processCheckoutOrder(event)" class="space-y-8">
                <!-- Shipping Details -->
                <div class="border border-neutral-800 p-6 space-y-4 bg-neutral-900/20">
                    <h3 class="text-xs uppercase tracking-mega font-bold text-neutral-400">1. Shipping Address</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <input type="text" placeholder="FIRST NAME" required class="w-full bg-neutral-950 border border-neutral-800 p-3 text-xs uppercase tracking-widest focus:outline-none focus:border-white font-light placeholder-neutral-600">
                        <input type="text" placeholder="LAST NAME" required class="w-full bg-neutral-950 border border-neutral-800 p-3 text-xs uppercase tracking-widest focus:outline-none focus:border-white font-light placeholder-neutral-600">
                    </div>
                    <input type="text" placeholder="STREET ADDRESS" required class="w-full bg-neutral-950 border border-neutral-800 p-3 text-xs uppercase tracking-widest focus:outline-none focus:border-white font-light placeholder-neutral-600">
                    <div class="grid grid-cols-3 gap-4">
                        <input type="text" placeholder="CITY" required class="w-full bg-neutral-950 border border-neutral-800 p-3 text-xs uppercase tracking-widest focus:outline-none focus:border-white font-light placeholder-neutral-600">
                        <input type="text" placeholder="STATE" required class="w-full bg-neutral-950 border border-neutral-800 p-3 text-xs uppercase tracking-widest focus:outline-none focus:border-white font-light placeholder-neutral-600">
                        <input type="text" placeholder="ZIP CODE" required class="w-full bg-neutral-950 border border-neutral-800 p-3 text-xs uppercase tracking-widest focus:outline-none focus:border-white font-light placeholder-neutral-600">
                    </div>
                </div>

                <!-- Payment Details -->
                <div class="border border-neutral-800 p-6 space-y-4 bg-neutral-900/20">
                    <h3 class="text-xs uppercase tracking-mega font-bold text-neutral-400">2. Payment Information</h3>
                    <input type="text" placeholder="CARDHOLDER NAME" required class="w-full bg-neutral-950 border border-neutral-800 p-3 text-xs uppercase tracking-widest focus:outline-none focus:border-white font-light placeholder-neutral-600">
                    <input type="text" placeholder="CARD NUMBER (XXXX XXXX XXXX XXXX)" maxlength="19" required class="w-full bg-neutral-950 border border-neutral-800 p-3 text-xs uppercase tracking-widest focus:outline-none focus:border-white font-light placeholder-neutral-600">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" placeholder="MM / YY" maxlength="5" required class="w-full bg-neutral-950 border border-neutral-800 p-3 text-xs uppercase tracking-widest focus:outline-none focus:border-white font-light placeholder-neutral-600">
                        <input type="password" placeholder="CVV" maxlength="4" required class="w-full bg-neutral-950 border border-neutral-800 p-3 text-xs uppercase tracking-widest focus:outline-none focus:border-white font-light placeholder-neutral-600">
                    </div>
                </div>

                <!-- Summary & Submit -->
                <div class="border border-neutral-800 p-6 space-y-4 bg-neutral-900/20">
                    <div class="flex justify-between text-xs font-bold uppercase tracking-widest">
                        <span>TOTAL AMOUNT DUE:</span>
                        <span id="checkout-total-price">$0 USD</span>
                    </div>
                    <button type="submit" class="w-full bg-white text-black text-xs uppercase font-normal tracking-widest py-4 hover:opacity-90 transition-all active:scale-95">
                        COMPLETE ORDER
                    </button>
                </div>
            </form>
        </div>

    </main>

    <!-- Cart Drawer -->
    <div id="cart-drawer" class="fixed inset-0 z-50 overflow-hidden hidden">
        <div id="cart-backdrop" class="absolute inset-0 bg-black/70 backdrop-blur-sm opacity-0 transition-opacity duration-300" onclick="toggleCart()"></div>
        <div id="cart-panel" class="absolute inset-y-0 right-0 max-w-full flex pl-10 transform translate-x-full transition-transform duration-300 ease-in-out">
            <div id="cart-panel-box" class="w-screen max-w-md bg-[#0a0a0a] text-white shadow-2xl flex flex-col text-xs border-l border-neutral-900">
                <div class="flex items-center justify-between p-6 border-b border-neutral-900">
                    <span class="text-xs font-semibold tracking-mega uppercase">BAG (<span id="cart-items-count">0</span>)</span>
                    <button onclick="toggleCart()" class="text-lg p-2"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="cart-items-container" class="flex-1 overflow-y-auto p-6 space-y-6">
                    <div class="text-center py-20 text-neutral-500 text-xs uppercase tracking-widest font-light">YOUR BAG IS EMPTY</div>
                </div>
                <div id="cart-footer" class="p-6 border-t border-neutral-900 bg-[#0a0a0a]">
                    <div class="flex justify-between text-xs font-bold uppercase tracking-widest mb-3">
                        <span>TOTAL</span>
                        <span id="cart-subtotal">$0</span>
                    </div>
                    <button id="checkout-btn" onclick="proceedToCheckout()" class="w-full bg-white text-black text-xs uppercase font-normal tracking-widest py-4 hover:opacity-90 transition-all active:scale-95 shadow-md">
                        PROCEED TO CHECKOUT
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Generic Modal -->
    <div id="generic-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div id="modal-backdrop" class="absolute inset-0 bg-black/70 backdrop-blur-sm opacity-0 transition-opacity duration-300" onclick="closeModal()"></div>
        <div id="modal-content-box" class="relative bg-[#0a0a0a] text-white w-full max-w-md shadow-2xl p-8 z-10 text-xs transform scale-95 opacity-0 transition-all duration-300 border border-neutral-900">
            <div class="flex justify-between items-center mb-6 border-b border-neutral-900 pb-3" id="modal-header-border">
                <h3 id="modal-title" class="text-xs font-bold uppercase tracking-mega">NOTICE</h3>
                <button onclick="closeModal()" class="text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modal-body" class="text-xs uppercase tracking-widest leading-relaxed font-light"></div>
        </div>
    </div>

    <script>
        let cart = [];
        let wishlist = JSON.parse(localStorage.getItem('sop_wishlist')) || [];
        let currentProduct = null;
        let currentCategory = 'ALL';
        let isDarkMode = true;

        function applyThemeStyles() {
            const body = document.body;
            const header = document.getElementById('site-header');
            const searchBar = document.getElementById('search-bar-container');
            const cartDrawerBox = document.getElementById('cart-panel-box');
            const cartFooter = document.getElementById('cart-footer');
            const modalBox = document.getElementById('modal-content-box');
            const modalHeader = document.getElementById('modal-header-border');
            const themeBtn = document.getElementById('theme-toggle-btn').querySelector('i');
            const cartIcon = document.getElementById('cart-icon-img');

            if (isDarkMode) {
                body.style.backgroundColor = '#0a0a0a';
                body.style.color = '#ffffff';
                header.className = 'sticky top-0 z-50 border-b border-neutral-900 bg-[#0a0a0a] text-white transition-colors duration-300';
                searchBar.className = 'border-t border-neutral-900 bg-[#0a0a0a] px-6 py-2.5 transition-colors duration-300';
                cartDrawerBox.className = 'w-screen max-w-md bg-[#0a0a0a] text-white shadow-2xl flex flex-col text-xs border-l border-neutral-900 transition-colors duration-300';
                cartFooter.className = 'p-6 border-t border-neutral-900 bg-[#0a0a0a] transition-colors duration-300';
                modalBox.className = 'relative bg-[#0a0a0a] text-white w-full max-w-md shadow-2xl p-8 z-10 text-xs transform scale-95 opacity-0 transition-all duration-300 border border-neutral-900';
                modalHeader.className = 'flex justify-between items-center mb-6 border-b border-neutral-900 pb-3';
                themeBtn.className = 'fa-solid fa-moon text-sm';
                cartIcon.src = 'https://cdn.discordapp.com/emojis/810828604417507340.gif';
            } else {
                body.style.backgroundColor = '#f9f9f9';
                body.style.color = '#111111';
                header.className = 'sticky top-0 z-50 border-b border-neutral-200 bg-[#f9f9f9] text-neutral-900 transition-colors duration-300';
                searchBar.className = 'border-t border-neutral-200 bg-[#f9f9f9] px-6 py-2.5 transition-colors duration-300';
                cartDrawerBox.className = 'w-screen max-w-md bg-[#f9f9f9] text-neutral-900 shadow-2xl flex flex-col text-xs border-l border-neutral-200 transition-colors duration-300';
                cartFooter.className = 'p-6 border-t border-neutral-200 bg-[#f9f9f9] transition-colors duration-300';
                modalBox.className = 'relative bg-[#f9f9f9] text-neutral-900 w-full max-w-md shadow-2xl p-8 z-10 text-xs transform scale-95 opacity-0 transition-all duration-300 border border-neutral-200';
                modalHeader.className = 'flex justify-between items-center mb-6 border-b border-neutral-200 pb-3';
                themeBtn.className = 'fa-solid fa-sun text-sm text-amber-500';
                cartIcon.src = 'https://cdn.discordapp.com/emojis/653933804104187917.webp';
            }
            filterCategory(currentCategory);
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            applyThemeStyles();
        }

        let lastScrollTop = 0;
        const header = document.getElementById('site-header');
        window.addEventListener('scroll', () => {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > lastScrollTop && scrollTop > 80) {
                header.classList.add('header-hidden');
            } else {
                header.classList.remove('header-hidden');
            }
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
        });

        const products = [
            {
                id: 1,
                name: 'SASORI QUOTE TEE',
                price: 50,
                category: 'TOPS',
                material: 'Cotton',
                images: [
                    'https://media.discordapp.net/attachments/1550353769395388508/1551158064869154919/content.png?ex=6ab0f405&is=6aafa285&hm=ccd986bdd42cba86b8039fe4490b432149254f4fd2cdfd950b87bba7fa70a715&=&format=webp&quality=lossless&width=1024&height=980'
                ]
            }
        ];

        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const mobileMenuClose = document.getElementById('mobile-menu-close');
        mobileMenuBtn.addEventListener('click', () => mobileMenu.classList.remove('translate-x-full'));
        mobileMenuClose.addEventListener('click', () => mobileMenu.classList.add('translate-x-full'));
        function closeMobileMenu() { mobileMenu.classList.add('translate-x-full'); }

        function switchPage(pageId) {
            const pages = ['page-shop', 'page-product-detail', 'page-checkout'];
            pages.forEach(id => {
                const el = document.getElementById(id);
                if (id === pageId) {
                    el.classList.remove('hidden');
                    el.classList.remove('animate-slide-up');
                    void el.offsetWidth;
                    el.classList.add('animate-slide-up');
                } else {
                    el.classList.add('hidden');
                }
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showShop() { switchPage('page-shop'); renderProducts(); }

        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                const btnCategory = btn.getAttribute('data-category');
                if (btnCategory === category) {
                    btn.className = isDarkMode 
                        ? 'cat-btn px-6 py-2.5 border border-white bg-white text-black font-medium' 
                        : 'cat-btn px-6 py-2.5 border border-neutral-900 bg-neutral-900 text-white font-medium';
                } else {
                    btn.className = isDarkMode 
                        ? 'cat-btn px-6 py-2.5 border border-neutral-800 text-neutral-400 hover:border-white' 
                        : 'cat-btn px-6 py-2.5 border border-neutral-300 text-neutral-600 hover:border-neutral-900';
                }
            });
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const filtered = currentCategory === 'ALL' ? products : products.filter(p => p.category === currentCategory);

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-neutral-500 text-xs uppercase tracking-widest font-light">NO PRODUCTS FOUND</div>`;
                return;
            }

            const cardBg = isDarkMode ? 'bg-neutral-900/50 border-neutral-800' : 'bg-neutral-100 border-neutral-300';
            const textColor = isDarkMode ? 'text-white' : 'text-neutral-900';

            grid.innerHTML = filtered.map(product => {
                const isFavorited = wishlist.some(item => item.id === product.id);
                return `
                    <div class="group cursor-pointer flex flex-col transition-all duration-300 hover:-translate-y-1 relative" onclick="openProductDetail(${product.id})">
                        <div class="relative w-full h-[450px] ${cardBg} border rounded-none overflow-hidden flex items-center justify-center p-6">
                            <img src="${product.images[0]}" alt="${product.name}" class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-500 pointer-events-none">
                            <button onclick="event.stopPropagation(); toggleWishlist(${product.id});" class="absolute top-4 right-4 w-9 h-9 ${isDarkMode ? 'bg-black/60 text-white' : 'bg-white/80 text-neutral-900'} backdrop-blur-sm flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity shadow-md z-10" aria-label="Favorite">
                                <i class="${isFavorited ? 'fa-solid text-red-500' : 'fa-regular'} fa-heart text-sm"></i>
                            </button>
                        </div>
                        <div class="mt-4 flex justify-between items-center text-xs">
                            <h4 class="font-medium uppercase tracking-widest ${textColor}">${product.name}</h4>
                            <span class="font-semibold tracking-wider ${textColor}">$${product.price} USD</span>
                        </div>
                    </div>
                `;
            }).join('');
            updateWishlistBadge();
        }

        function toggleWishlist(productId) {
            let product = products.find(p => p.id === productId) || wishlist.find(item => item.id === productId);
            if (!product) return;

            const index = wishlist.findIndex(item => item.id === productId);
            if (index > -1) {
                wishlist.splice(index, 1);
                showNotification('Removed from favorites');
            } else {
                wishlist.push({ id: product.id, name: product.name, price: product.price, material: product.material || 'Cotton', image: product.images ? product.images[0] : product.image });
                showNotification('Added to favorites');
            }
            localStorage.setItem('sop_wishlist', JSON.stringify(wishlist));
            updateWishlistBadge();
            renderProducts();
        }

        function updateWishlistBadge() { document.getElementById('wishlist-count').innerText = wishlist.length; }

        function openProductDetail(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            currentProduct = product;
            switchPage('page-product-detail');

            document.getElementById('detail-title').innerText = product.name;
            document.getElementById('detail-price').innerText = `$${product.price} USD`;
            document.getElementById('detail-material').innerText = product.material;
            document.getElementById('detail-active-img').src = product.images[0];

            document.getElementById('detail-thumbnails').innerHTML = product.images.map((img, idx) => `
                <div onclick="changeDetailImage('${img}', this)" class="w-16 h-20 ${isDarkMode ? 'bg-neutral-900 border-neutral-800' : 'bg-neutral-100 border-neutral-300'} cursor-pointer border ${idx === 0 ? (isDarkMode ? 'border-white' : 'border-neutral-900') : ''} p-1 flex items-center justify-center thumb-item">
                    <img src="${img}" class="w-full h-full object-contain pointer-events-none">
                </div>
            `).join('');
        }

        function changeDetailImage(imgSrc, thumbEl) {
            const activeImg = document.getElementById('detail-active-img');
            activeImg.style.opacity = '0';
            setTimeout(() => { activeImg.src = imgSrc; activeImg.style.opacity = '1'; }, 150);
            document.querySelectorAll('.thumb-item').forEach(el => el.classList.remove(isDarkMode ? 'border-white' : 'border-neutral-900'));
            thumbEl.classList.add(isDarkMode ? 'border-white' : 'border-neutral-900');
        }

        function addCurrentProductToCart() {
            if (!currentProduct) return;
            addToCart(currentProduct.name, currentProduct.price, currentProduct.material, currentProduct.images[0]);
        }

        function handleSearchInput(e) {
            if (e.key === 'Enter' && e.target.value.trim()) {
                showShop();
                showNotification(`Searching for "${e.target.value.trim().toUpperCase()}"...`);
            }
        }

        function toggleCart() {
            const drawer = document.getElementById('cart-drawer');
            const backdrop = document.getElementById('cart-backdrop');
            const panel = document.getElementById('cart-panel');

            if (drawer.classList.contains('hidden')) {
                drawer.classList.remove('hidden');
                renderCart();
                setTimeout(() => { backdrop.classList.remove('opacity-0'); panel.classList.remove('translate-x-full'); }, 10);
            } else {
                backdrop.classList.add('opacity-0');
                panel.classList.add('translate-x-full');
                setTimeout(() => drawer.classList.add('hidden'), 300);
            }
        }

        function addToCart(name, price, details, image) {
            const existingItem = cart.find(item => item.name === name && item.details === details);
            if (existingItem) { existingItem.quantity += 1; } 
            else { cart.push({ name, price, details, quantity: 1, image }); }
            updateCartBadge();
            showNotification('Added to bag');
        }

        function updateCartBadge() {
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cart-count').innerText = totalItems;
            document.getElementById('cart-items-count').innerText = totalItems;
        }

        function renderCart() {
            const container = document.getElementById('cart-items-container');
            const subtotalEl = document.getElementById('cart-subtotal');
            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-neutral-500 text-xs uppercase tracking-widest font-light">YOUR BAG IS EMPTY</div>`;
                subtotalEl.innerText = '$0';
                return;
            }
            let subtotal = 0;
            const thumbBg = isDarkMode ? 'bg-neutral-900 border-neutral-800' : 'bg-neutral-100 border-neutral-300';
            const textColor = isDarkMode ? 'text-white' : 'text-neutral-900';
            const borderCol = isDarkMode ? 'border-neutral-900' : 'border-neutral-200';

            container.innerHTML = cart.map((item, index) => {
                subtotal += item.price * item.quantity;
                return `
                    <div class="flex justify-between items-center border-b ${borderCol} pb-4">
                        <div class="flex space-x-4 items-center">
                            <div class="w-16 h-20 ${thumbBg} border flex-shrink-0 p-1 flex items-center justify-center">
                                <img src="${item.image}" class="w-full h-full object-contain pointer-events-none">
                            </div>
                            <div>
                                <h4 class="text-xs font-semibold uppercase tracking-widest ${textColor}">${item.name}</h4>
                                <p class="text-[10px] text-neutral-400 uppercase tracking-wider mt-1 font-light">${item.details}</p>
                                <p class="text-xs font-bold tracking-wider mt-2 ${textColor}">$${item.price.toLocaleString()}</p>
                            </div>
                        </div>
                        <div class="flex flex-col items-end space-y-2">
                            <button onclick="removeFromCart(${index})" class="text-neutral-500 hover:text-red-500 text-sm"><i class="fa-solid fa-trash"></i></button>
                            <span class="text-[10px] text-neutral-400 font-light">QTY: ${item.quantity}</span>
                        </div>
                    </div>
                `;
            }).join('');
            subtotalEl.innerText = `$${subtotal.toLocaleString()}`;
        }

        function removeFromCart(index) { cart.splice(index, 1); updateCartBadge(); renderCart(); }

        function proceedToCheckout() {
            if (cart.length === 0) { showNotification("Your bag is empty."); return; }
            toggleCart();
            let subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('checkout-total-price').innerText = `$${subtotal.toLocaleString()} USD`;
            switchPage('page-checkout');
        }

        function processCheckoutOrder(e) {
            e.preventDefault();
            showNotification("Processing secure payment...");
            setTimeout(() => {
                cart = [];
                updateCartBadge();
                showShop();
                showNotification("Order placed successfully! Confirmation sent.");
            }, 2000);
        }

        function openModal(type) {
            const modal = document.getElementById('generic-modal');
            const backdrop = document.getElementById('modal-backdrop');
            const box = document.getElementById('modal-content-box');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');
            
            modal.classList.remove('hidden');
            setTimeout(() => { backdrop.classList.remove('opacity-0'); box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);

            if (type === 'login') {
                title.innerText = 'LOGIN';
                const inputBg = isDarkMode ? 'bg-neutral-950 border-neutral-800 text-white' : 'bg-white border-neutral-300 text-black';
                const btnBg = isDarkMode ? 'bg-white text-black' : 'bg-neutral-900 text-white';
                body.innerHTML = `
                    <form onsubmit="handleLogin(event)" class="flex flex-col space-y-4 mt-4">
                        <input type="email" placeholder="EMAIL" required class="border ${inputBg} p-3 text-xs uppercase tracking-widest focus:outline-none font-light placeholder-neutral-500">
                        <input type="password" placeholder="PASSWORD" required class="border ${inputBg} p-3 text-xs uppercase tracking-widest focus:outline-none font-light placeholder-neutral-500">
                        <button type="submit" class="${btnBg} text-xs font-normal uppercase tracking-widest py-3 mt-1 transition-all active:scale-95 hover:opacity-90">SIGN IN</button>
                    </form>
                `;
            }
        }

        function closeModal() {
            const modal = document.getElementById('generic-modal');
            const backdrop = document.getElementById('modal-backdrop');
            const box = document.getElementById('modal-content-box');
            backdrop.classList.add('opacity-0');
            box.classList.remove('scale-100', 'opacity-100');
            box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function openWishlist() {
            const modal = document.getElementById('generic-modal');
            const backdrop = document.getElementById('modal-backdrop');
            const box = document.getElementById('modal-content-box');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');
            
            modal.classList.remove('hidden');
            setTimeout(() => { backdrop.classList.remove('opacity-0'); box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);

            title.innerText = 'WISHLIST';
            if (wishlist.length === 0) {
                body.innerHTML = `<div class="text-center py-10 text-neutral-500 uppercase tracking-widest font-light">YOUR WISHLIST IS EMPTY</div>`;
                return;
            }

            const borderCol = isDarkMode ? 'border-neutral-900' : 'border-neutral-200';
            body.innerHTML = `
                <div class="space-y-4 mt-3 max-h-[60vh] overflow-y-auto pr-2">
                    ${wishlist.map(item => `
                        <div class="flex justify-between items-center border-b ${borderCol} pb-3 gap-4">
                            <div class="flex items-center space-x-3">
                                <img src="${item.image}" class="w-10 h-12 object-contain bg-neutral-900/50 p-1 border border-neutral-800">
                                <div>
                                    <span class="font-light block">${item.name}</span>                                     <span class="text-[10px] text-neutral-400">$${item.price} USD</span>
                                </div>
                            </div>
                            <div class="flex items-center space-x-3">
                                <button onclick="addToCart('${item.name}',${item.price}, '${item.material}', '${item.image}'); closeModal();" class="text-[10px] font-medium underline hover:opacity-75">MOVE TO BAG</button>
                                <button onclick="toggleWishlist(${item.id}); openWishlist();" class="text-neutral-500 hover:text-red-500"><i class="fa-solid fa-trash text-xs"></i></button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function handleLogin(e) { e.preventDefault(); closeModal(); showNotification("Logged in!"); }

        function showNotification(msg) {
            const notif = document.createElement('div');
            const bgClass = isDarkMode ? 'bg-[#121212] text-white border border-neutral-800' : 'bg-white text-neutral-900 border border-neutral-300';
            notif.className = `fixed bottom-6 left-1/2 -translate-x-1/2 ${bgClass} text-xs tracking-widest px-6 py-3 uppercase z-50 shadow-2xl transition-all duration-300 font-light translate-y-4 opacity-0`;
            notif.innerText = msg;
            document.body.appendChild(notif);
            setTimeout(() => notif.classList.remove('translate-y-4', 'opacity-0'), 10);
            setTimeout(() => {
                notif.classList.add('translate-y-4', 'opacity-0');
                setTimeout(() => notif.remove(), 300);
            }, 3000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateWishlistBadge();
            showShop();
        });
    </script>
</body>
</html>
